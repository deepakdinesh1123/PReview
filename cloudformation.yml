AWSTemplateFormatVersion: '2010-09-09'
Description: 'PReview: IAM Roles and S3 Bucket for GitHub Actions MicroVM deployments'

Parameters:
  GitHubRepository:
    Type: String
    Description: '(Optional) The GitHub repository for OIDC (e.g., your-org/your-repo). Leave blank if using traditional AWS Access Keys.'
    Default: ''

  CreateOIDCProvider:
    Type: String
    Description: 'Create a GitHub Actions OIDC provider? Select "No" if your AWS account already has one or if using Access Keys.'
    Default: 'Yes'
    AllowedValues:
      - 'Yes'
      - 'No'

Conditions:
  UseOIDC: !Not [!Equals [!Ref GitHubRepository, '']]
  ShouldCreateOIDCProvider: !And 
    - !Condition UseOIDC
    - !Equals [!Ref CreateOIDCProvider, 'Yes']

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'PReviewBuildRole-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: 
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PReviewBuildPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${ArtifactBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:CreateLogGroup
                Resource: 'arn:aws:logs:*:*:*'

  DeployerManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'PReviewDeployerPolicy-${AWS::Region}'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - lambda:CreateMicrovmImage
              - lambda:UpdateMicrovmImage
              - lambda:GetMicrovmImage
              - lambda:ListMicrovmImages
              - lambda:DeleteMicrovmImage
              - lambda:RunMicrovm
              - lambda:GetMicrovm
              - lambda:ListMicrovms
              - lambda:TerminateMicrovm
              - lambda:CreateMicrovmAuthToken
              - lambda:TagResource
              - lambda:PassNetworkConnector
            Resource: '*'
          - Effect: Allow
            Action:
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub '${ArtifactBucket.Arn}/*'
          - Effect: Allow
            Action: s3:ListBucket
            Resource: !GetAtt ArtifactBucket.Arn
          - Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt BuildRole.Arn

  DeployerRole:
    Type: AWS::IAM::Role
    Condition: UseOIDC
    Properties:
      RoleName: !Sub 'PReviewDeployerRole-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If 
                - ShouldCreateOIDCProvider
                - !Ref GitHubOIDCProvider
                - !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepository}:*'
              StringEquals:
                token.actions.githubusercontent.com:aud: 'sts.amazonaws.com'
      ManagedPolicyArns:
        - !Ref DeployerManagedPolicy

Outputs:
  DeployerManagedPolicyARN:
    Description: 'If using Access Keys, attach this Managed Policy to your IAM User'
    Value: !Ref DeployerManagedPolicy
  DeployerRoleARN:
    Condition: UseOIDC
    Description: 'If using OIDC, add this to your GitHub workflow (role-to-assume)'
    Value: !GetAtt DeployerRole.Arn
  BuildRoleARN:
    Description: 'Add this to your preview.yml workflow (buildRoleARN)'
    Value: !GetAtt BuildRole.Arn
  S3Path:
    Description: 'Add this to your preview.yml workflow (s3Path)'
    Value: !Sub 's3://${ArtifactBucket}/previews'
